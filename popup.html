<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>PDF sentence navigator</title>
  </head>
  <body>
    <main class="popup">
      <div class="eyebrow">Local Chrome Extension</div>
      <h1>PDF sentence navigator</h1>
      <p class="lede">Open a PDF in the active tab, then extract and navigate its sentences locally.</p>
      <button id="processButton" type="button">Process current PDF</button>
      <p class="hint">Tip: press <kbd>Tab</kbd>, <kbd>Shift</kbd> + <kbd>Tab</kbd>, and <kbd>Esc</kbd> after processing.</p>
      <p id="status" class="status">Ready.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
