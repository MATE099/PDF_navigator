# Runs syntax checks and unit tests on every push and pull request.
name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci also runs the postinstall script that syncs vendor/pdfjs
      - run: npm ci

      - run: npm run verify
